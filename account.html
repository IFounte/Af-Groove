<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AF-GROOVE — Hesap Yönetimi</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
      // Bu sayfada (Hesabı Yönet) otomatik ana sayfaya yönlendirmeyi kapat
      // Böylece auth gözlemcisi profil tamam ise bile anasayfaya taşımayacak
      window.AG_DISABLE_HOME_REDIRECT = true;
    </script>
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <div class="brand">
          <a href="anasayfa.html" style="display:flex;align-items:center;text-decoration:none;">
            <img class="brand-logo" src="assets/afgroove-full.svg" alt="AF-GROOVE" />
          </a>
        </div>
        <div class="top-controls">
          <div id="userArea" class="user-area" aria-live="polite"></div>
          <div class="header-auth" id="headerAuth">
            <button id="headerSignupBtn" class="btn primary">Kayıt Ol</button>
            <button id="headerSigninBtn" class="btn secondary">Giriş Yap</button>
          </div>
          <button class="theme-toggle" id="themeToggle" aria-label="Tema değiştir">
            <span class="toggle-track" aria-hidden="true"></span>
            <span class="toggle-knob" aria-hidden="true">
              <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="12" cy="12" r="5" fill="currentColor" />
                <g fill="currentColor">
                  <circle cx="12" cy="3" r="1.1" />
                  <circle cx="12" cy="21" r="1.1" />
                  <circle cx="21" cy="12" r="1.1" />
                  <circle cx="3" cy="12" r="1.1" />
                  <circle cx="18.5" cy="5.5" r="1.1" />
                  <circle cx="5.5" cy="5.5" r="1.1" />
                  <circle cx="18.5" cy="18.5" r="1.1" />
                  <circle cx="5.5" cy="18.5" r="1.1" />
                </g>
              </svg>
              <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" fill="currentColor" />
              </svg>
            </span>
          </button>
        </div>
      </div>
    </header>
    <main style="width:100%;display:flex;justify-content:center;align-items:flex-start;padding:32px 18px;">
      <div class="account-panel" style="max-width:760px;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:28px;">
        <h1 style="margin:0;font-size:30px;">Hesap Yönetimi</h1>
        <p style="margin:0 0 4px;color:var(--muted);font-size:14px;">E-posta, parola gibi temel bilgilerini güncelleyebilirsin.</p>
        <section class="acct-section" id="emailSection">
          <h2 style="margin:0 0 12px;font-size:20px;">E-posta</h2>
          <div class="field" style="display:flex;flex-direction:column;gap:6px;">
            <label for="currentEmail" style="font-size:13px;color:var(--muted);font-weight:600;">Mevcut E-posta</label>
            <input id="currentEmail" type="email" disabled />
          </div>
          <div class="field" style="display:flex;flex-direction:column;gap:6px;margin-top:12px;">
            <label for="newEmail" style="font-size:13px;color:var(--muted);font-weight:600;">Yeni E-posta</label>
            <input id="newEmail" type="email" placeholder="yeni@email.com" />
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:12px;">
            <button id="btnUpdateEmail" class="btn primary" style="min-width:160px;">E-postayı Güncelle</button>
          </div>
          <div id="emailMsg" class="status-msg"></div>
        </section>
        <section class="acct-section" id="passwordSection">
          <h2 style="margin:0 0 12px;font-size:20px;">Parola</h2>
          <div class="field" style="display:flex;flex-direction:column;gap:6px;">
            <label for="newPass" style="font-size:13px;color:var(--muted);font-weight:600;">Yeni Parola</label>
            <input id="newPass" type="password" placeholder="Yeni parola" />
          </div>
          <div class="field" style="display:flex;flex-direction:column;gap:6px;margin-top:12px;">
            <label for="newPass2" style="font-size:13px;color:var(--muted);font-weight:600;">Yeni Parola (Tekrar)</label>
            <input id="newPass2" type="password" placeholder="Parola tekrar" />
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:12px;">
            <button id="btnUpdatePass" class="btn secondary" style="min-width:160px;">Parolayı Güncelle</button>
          </div>
          <div id="passMsg" class="status-msg"></div>
        </section>
        <section class="acct-section" id="phoneSection">
          <h2 style="margin:0 0 12px;font-size:20px;">Telefon Numarası</h2>
          <p style="margin:0;color:var(--muted);font-size:13px;">Telefon numarası doğrulama ve güncelleme yakında eklenecek.</p>
        </section>
      </div>
    </main>
    <footer style="padding:18px;text-align:center;color:var(--muted);"><small>© <span id="year"></span> AF-GROOVE</small></footer>
    <script src="script.js" defer></script>
    <script src="firebase-auth.js" defer></script>
    <script>
      // After auth loads, populate fields
      window.addEventListener('load', () => {
        setTimeout(() => {
          if(typeof firebase !== 'undefined' && firebase.auth && firebase.auth().currentUser){
            const user = firebase.auth().currentUser;
            const cur = document.getElementById('currentEmail');
            if(cur) cur.value = user.email || '';
          }
        }, 500);
      });

      function showMsg(id, text, isError){
        const el = document.getElementById(id);
        if(el){ el.textContent = text; el.style.color = isError ? '#ff9c9c' : 'var(--muted)'; }
      }

      document.getElementById('btnUpdateEmail')?.addEventListener('click', async () => {
        const user = firebase.auth().currentUser;
        if(!user){ showMsg('emailMsg', 'Önce giriş yapmalısın.', true); return; }
        const newEmail = document.getElementById('newEmail').value.trim();
        if(!newEmail){ showMsg('emailMsg', 'Lütfen yeni e-posta girin.', true); return; }
        try{
          await user.updateEmail(newEmail);
          showMsg('emailMsg', 'E-posta güncellendi.', false);
          const cur = document.getElementById('currentEmail'); if(cur) cur.value = newEmail;
        }catch(e){ showMsg('emailMsg', (e && e.message) ? 'Değiştirilemedi: ' + e.message : 'Hata oluştu.', true); }
      });

      document.getElementById('btnUpdatePass')?.addEventListener('click', async () => {
        const user = firebase.auth().currentUser;
        if(!user){ showMsg('passMsg', 'Önce giriş yapmalısın.', true); return; }
        const p1 = document.getElementById('newPass').value;
        const p2 = document.getElementById('newPass2').value;
        if(!p1 || !p2){ showMsg('passMsg', 'Lütfen iki alanı da doldurun.', true); return; }
        if(p1 !== p2){ showMsg('passMsg', 'Parolalar eşleşmiyor.', true); return; }
        if(p1.length < 6){ showMsg('passMsg', 'Parola en az 6 karakter olmalı.', true); return; }
        try{
          await user.updatePassword(p1);
          showMsg('passMsg', 'Parola güncellendi.', false);
          document.getElementById('newPass').value='';
          document.getElementById('newPass2').value='';
        }catch(e){ showMsg('passMsg', (e && e.message) ? 'Hata: ' + e.message : 'Parola değiştirilemedi.', true); }
      });
    </script>
  </body>
</html>
