<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AF-GROOVE</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Firebase (compat) SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <!-- Copy firebase-config.example.js -> firebase-config.js and fill your config -->
    <script src="firebase-config.js"></script>
    <script src="supabase-config.js"></script>
    
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <div class="brand">
          <!-- Full logo image (includes text) -->
          <img class="brand-logo" src="assets/afgroove-full.svg" alt="AF-GROOVE" />
        </div>

        <div class="top-controls">
          <div id="userArea" class="user-area" aria-live="polite">
            <!-- Filled by auth code: shows login/register or user/email + sign out -->
          </div>

          <div class="header-auth" id="headerAuth">
            <button id="headerSignupBtn" class="btn primary">Kayıt Ol</button>
            <button id="headerSigninBtn" class="btn secondary">Giriş Yap</button>
          </div>

          <button class="theme-toggle" id="themeToggle" aria-label="Tema değiştir">
            <span class="toggle-track" aria-hidden="true"></span>
            <!-- knob contains icons so they stay centered -->
            <span class="toggle-knob" aria-hidden="true">
              <!-- Sun (now gray like moon) -->
              <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="12" cy="12" r="5" fill="currentColor" />
                <g fill="currentColor">
                  <circle cx="12" cy="3" r="1.1" />
                  <circle cx="12" cy="21" r="1.1" />
                  <circle cx="21" cy="12" r="1.1" />
                  <circle cx="3" cy="12" r="1.1" />
                  <circle cx="18.5" cy="5.5" r="1.1" />
                  <circle cx="5.5" cy="5.5" r="1.1" />
                  <circle cx="18.5" cy="18.5" r="1.1" />
                  <circle cx="5.5" cy="18.5" r="1.1" />
                </g>
              </svg>
              <!-- Moon -->
              <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" fill="currentColor" />
              </svg>
            </span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="ghost-wrap">
          <!-- Yeni hayalet görseli -->
          <img src="assets/yeniruh.svg" alt="AF-GROOVE Maskot" class="ghost" width="220" height="220" />
        </div>

        <div class="welcome">
          <h1 id="typed" aria-live="polite"></h1>
          <div class="buttons">
            <button id="openSignup" class="btn primary">Hadi! Başlayalım.</button>
            <button id="openSignin" class="btn secondary">Zaten bir hesabım var</button>
          </div>
        </div>
      </section>

      <!-- App / Questionnaire area (hidden until user starts or is authenticated) -->
      <section id="appArea" class="app-area" style="display:none; padding:40px; text-align:center;">
        <h2 id="appWelcome">Hoşgeldiniz!</h2>
        <p>Bu alanda kısa bir anket / yönlendirme ekranı olacak. Şimdilik boş.</p>
      </section>
    </main>

    <footer>
      <small>© <span id="year"></span> AF-GROOVE</small>
    </footer>

    <script src="script.js" defer></script>
    <script src="badges-supabase.js" defer></script>
    <script src="firebase-auth.js" defer></script>
  </body>
</html>
