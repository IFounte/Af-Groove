<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AF-GROOVE — Anasayfa</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Firebase SDKs and config loaded so auth-observer in firebase-auth.js can run and render the app -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="supabase-config.js"></script>
    <script>
      // Anasayfa koruma: Giriş yapmayan kullanıcıları index.html'e yönlendir
      (function(){
        if(typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined'){
          try{
            firebase.initializeApp(firebaseConfig);
            firebase.auth().onAuthStateChanged(function(user){
              if(!user){
                // Kullanıcı giriş yapmamış, index.html'e yönlendir
                window.location.href = 'index.html';
              }
            });
          }catch(e){
            // Firebase zaten initialize edilmiş olabilir
            try{
              firebase.auth().onAuthStateChanged(function(user){
                if(!user){
                  window.location.href = 'index.html';
                }
              });
            }catch(_){}
          }
        }
      })();
    </script>
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <div class="brand">
          <img class="brand-logo" src="assets/afgroove-full.svg" alt="AF-GROOVE" />
        </div>

        <div class="top-controls">
          <div id="userArea" class="user-area" aria-live="polite"></div>

          <div class="header-auth" id="headerAuth">
            <button id="headerSignupBtn" class="btn primary">Kayıt Ol</button>
            <button id="headerSigninBtn" class="btn secondary">Giriş Yap</button>
          </div>

          <button class="theme-toggle" id="themeToggle" aria-label="Tema değiştir">
            <span class="toggle-track" aria-hidden="true"></span>
            <span class="toggle-knob" aria-hidden="true">
              <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="12" cy="12" r="5" fill="currentColor" />
                <g fill="currentColor">
                  <circle cx="12" cy="3" r="1.1" />
                  <circle cx="12" cy="21" r="1.1" />
                  <circle cx="21" cy="12" r="1.1" />
                  <circle cx="3" cy="12" r="1.1" />
                  <circle cx="18.5" cy="5.5" r="1.1" />
                  <circle cx="5.5" cy="5.5" r="1.1" />
                  <circle cx="18.5" cy="18.5" r="1.1" />
                  <circle cx="5.5" cy="18.5" r="1.1" />
                </g>
              </svg>
              <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" fill="currentColor" /></svg>
            </span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <!-- App area — firebase-auth.js will render slider/cards here for signed-in users -->
      <section id="appArea" class="app-area" style="display:block; padding:20px;">
        <h2 id="appWelcome">AF-GROOVE</h2>
        <div id="appContentPlaceholder">Yükleniyor...</div>
      </section>
    </main>

    <footer>
      <small>© <span id="year"></span> AF-GROOVE</small>
    </footer>

    <script src="script.js" defer></script>
    <script src="badges-supabase.js" defer></script>
    <script src="firebase-auth.js" defer></script>
  </body>
</html>
