<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AF-GROOVE — Profil</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Firebase SDKs and config loaded so auth-observer in firebase-auth.js can run and render the app -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
      // Disable automatic redirect to homepage on auth
      window.AG_DISABLE_HOME_REDIRECT = true;
    </script>
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <div class="brand">
          <a href="anasayfa.html" style="display:flex;align-items:center;text-decoration:none;">
            <img class="brand-logo" src="assets/afgroove-full.svg" alt="AF-GROOVE" />
          </a>
        </div>

        <div class="top-controls">
          <div id="userArea" class="user-area" aria-live="polite"></div>

          <div class="header-auth" id="headerAuth">
            <button id="headerSignupBtn" class="btn primary">Kayıt Ol</button>
            <button id="headerSigninBtn" class="btn secondary">Giriş Yap</button>
          </div>

          <button class="theme-toggle" id="themeToggle" aria-label="Tema değiştir">
            <span class="toggle-track" aria-hidden="true"></span>
            <span class="toggle-knob" aria-hidden="true">
              <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="12" cy="12" r="5" fill="currentColor" />
                <g fill="currentColor">
                  <circle cx="12" cy="3" r="1.1" />
                  <circle cx="12" cy="21" r="1.1" />
                  <circle cx="21" cy="12" r="1.1" />
                  <circle cx="3" cy="12" r="1.1" />
                  <circle cx="18.5" cy="5.5" r="1.1" />
                  <circle cx="5.5" cy="5.5" r="1.1" />
                  <circle cx="18.5" cy="18.5" r="1.1" />
                  <circle cx="5.5" cy="18.5" r="1.1" />
                </g>
              </svg>
              <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" fill="currentColor" /></svg>
            </span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <!-- Profile Content -->
      <section class="profile-container">
        <div class="profile-banner">
          <div class="profile-avatar-wrapper">
            <div class="profile-avatar" id="profileAvatar">
              AG
            </div>
          </div>
        </div>
        <div class="profile-info">
          <div class="username-row">
            <h1 class="profile-username" id="profileUsername">Kullanıcı Adı</h1>
            <button id="editProfileBtn" class="btn secondary small" aria-label="Profili düzenle">Düzenle</button>
          </div>
          <section class="badges-section" aria-labelledby="badgesTitle">
            <h2 id="badgesTitle">Rozetler</h2>
            <div class="badges-grid" id="badgesGrid">
              <!-- Badges will be rendered here by script; initial placeholders: -->
            </div>
          </section>
        </div>
      </section>
    </main>

    <footer>
      <small>© <span id="year"></span> AF-GROOVE</small>
    </footer>

    <script src="script.js" defer></script>
    <script src="firebase-auth.js" defer></script>
    <script>
      // Load profile data when page loads
      window.addEventListener('load', () => {
        // Wait for Firebase auth to initialize
        setTimeout(() => {
          if(typeof firebase !== 'undefined' && firebase.auth && firebase.auth().currentUser){
            const user = firebase.auth().currentUser;
            const emailLocal = (user.email||'').split('@')[0];
            const stored = getStoredProfile(user.uid);
            const displayName = stored.displayName || user.displayName || emailLocal || 'Kullanıcı';
            const initials = (user.displayName ? user.displayName.split(' ').map(s=>s[0]).join('') : (user.email||'U').slice(0,2)).toUpperCase();
            
            // Update avatar
            const avatar = document.getElementById('profileAvatar');
            if(avatar){
              if(stored.avatarDataUrl){
                avatar.style.backgroundImage = `url('${stored.avatarDataUrl}')`;
                avatar.style.backgroundSize = 'cover';
                avatar.style.backgroundPosition = 'center';
                avatar.textContent = '';
              } else {
                avatar.textContent = initials;
              }
            }
            
            // Update username
            const username = document.getElementById('profileUsername');
            if(username) username.textContent = displayName;

            // Update banner
            const banner = document.querySelector('.profile-banner');
            if(banner){
              if(stored.bannerDataUrl){
                banner.style.background = `url('${stored.bannerDataUrl}') center/cover no-repeat`;
              }
            }

            // Hook up edit button
            const editBtn = document.getElementById('editProfileBtn');
            if(editBtn){ editBtn.addEventListener('click', ()=> openEditProfile(user.uid)); }

            // Render badges
            renderBadges(user.uid);
          }
        }, 500);
      });

      function profileKey(uid){ return `ag_profile_${uid}`; }
      function getStoredProfile(uid){
        try{ return JSON.parse(localStorage.getItem(profileKey(uid))||'{}'); }catch(_){ return {}; }
      }
      function saveStoredProfile(uid, patch){
        const current = getStoredProfile(uid);
        const next = Object.assign({}, current, patch||{});
        try{ localStorage.setItem(profileKey(uid), JSON.stringify(next)); }catch(_){ }
        return next;
      }

      function openEditProfile(uid){
        const data = getStoredProfile(uid);
        const modal = document.createElement('div');
        modal.className = 'edit-modal';
        modal.innerHTML = `
          <div class="edit-card" role="dialog" aria-modal="true" aria-labelledby="editTitle">
            <button class="close-edit" aria-label="Kapat">×</button>
            <h3 id="editTitle">Profili Düzenle</h3>
            <div class="edit-grid">
              <div class="img-picker">
                <label>Profil Fotoğrafı</label>
                <div id="avatarPreview" class="img-preview-avatar">Görsel seç</div>
              <input id="avatarInput" type="file" accept="image/*" style="display:none;" />
              </div>
              <div class="img-picker">
                <label>Banner</label>
                <div id="bannerPreview" class="img-preview-banner">Görsel seç</div>
              <input id="bannerInput" type="file" accept="image/*" style="display:none;" />
              </div>
              <div class="field">
                <label>İsim</label>
                <input id="inpName" type="text" placeholder="İsminiz" />
              </div>
              <div class="field">
                <label>Yaş</label>
                <input id="inpAge" type="number" min="8" max="120" />
              </div>
            </div>
            <div class="edit-actions">
              <button class="btn secondary" id="cancelEdit">İptal</button>
              <button class="btn primary" id="saveEdit">Kaydet</button>
            </div>
          </div>`;
        document.body.appendChild(modal);

        // Prefill
        const nameEl = modal.querySelector('#inpName');
        const ageEl = modal.querySelector('#inpAge');
        const avPrev = modal.querySelector('#avatarPreview');
        const bnPrev = modal.querySelector('#bannerPreview');
        if(nameEl) nameEl.value = data.displayName || '';
        if(ageEl) ageEl.value = data.age || '';
        // Show previously selected mascot IDs if any
  if(avPrev && data.avatarId){ avPrev.dataset.selectedId = data.avatarId; avPrev.textContent = 'Seçili'; }
  if(bnPrev && data.bannerId){ bnPrev.dataset.selectedId = data.bannerId; bnPrev.textContent = 'Seçili'; }

        modal.querySelector('.close-edit').addEventListener('click', ()=> modal.remove());
        modal.querySelector('#cancelEdit').addEventListener('click', ()=> modal.remove());

        // Selection modals (currently empty placeholder grid)
  avPrev.addEventListener('click', ()=> openSelectModal('avatar', (sel)=>{ if(sel){ avPrev.dataset.selectedId = sel; avPrev.textContent = 'Seçili'; } }));
  bnPrev.addEventListener('click', ()=> openSelectModal('banner', (sel)=>{ if(sel){ bnPrev.dataset.selectedId = sel; bnPrev.textContent = 'Seçili'; } }));

        modal.querySelector('#saveEdit').addEventListener('click', ()=>{
          const patch = {
            displayName: nameEl.value.trim() || undefined,
            age: ageEl.value ? String(ageEl.value).trim() : undefined,
            avatarId: avPrev && avPrev.dataset && avPrev.dataset.selectedId ? avPrev.dataset.selectedId : (data.avatarId||undefined),
            bannerId: bnPrev && bnPrev.dataset && bnPrev.dataset.selectedId ? bnPrev.dataset.selectedId : (data.bannerId||undefined)
          };
          const next = saveStoredProfile(uid, patch);

          // Apply to UI
          const username = document.getElementById('profileUsername');
          if(username){
            const email = (firebase.auth().currentUser.email||'');
            const emailLocal = email.split('@')[0];
            username.textContent = next.displayName || emailLocal || 'Kullanıcı';
          }
          const avatar = document.getElementById('profileAvatar');
          if(avatar){
            // Don't show raw avatarId text. Until assets are mapped, keep initials.
            const banner = document.querySelector('.profile-banner');
            if(banner && next.bannerId){ banner.dataset.bannerId = next.bannerId; }
          }
          // Remove legacy banner data URL handling; using IDs now
          modal.remove();
        });
      }

      // Global selection modal used by avatar/banner pickers
      function openSelectModal(kind, cb){
        const sm = document.createElement('div');
        sm.className = 'select-modal';
        sm.innerHTML = `
          <div class="select-card" role="dialog" aria-modal="true" aria-labelledby="selTitle">
            <h3 id="selTitle">${kind==='avatar'?'Profil Görseli Seç':'Banner Seç'}</h3>
            <div class="select-grid" id="graphicOptions">
              ${Array.from({length:8}).map((_,i)=>`<div class='select-item' data-id='${kind}-placeholder-${i}'>Boş</div>`).join('')}
            </div>
            <div class="select-actions">
              <button class="btn secondary" id="cancelSel">İptal</button>
              <button class="btn primary" id="saveSel" disabled>Kaydet</button>
            </div>
          </div>`;
        document.body.appendChild(sm);
        let chosen = null;
        const grid = sm.querySelector('#graphicOptions');
        grid.addEventListener('click', (e)=>{
          const item = e.target.closest('.select-item');
          if(!item) return;
          grid.querySelectorAll('.select-item').forEach(el=> el.style.outline='none');
          item.style.outline='3px solid var(--accent)';
          chosen = item.getAttribute('data-id');
          sm.querySelector('#saveSel').disabled = !chosen;
        });
        sm.querySelector('#cancelSel').addEventListener('click', ()=> sm.remove());
        sm.querySelector('#saveSel').addEventListener('click', ()=>{ if(chosen){ cb && cb(chosen); } sm.remove(); });
      }

      const BADGE_DEFS = [
        {id:'ilk-giris', title:'İlk Giriş', desc:'İlk kez giriş yaptın.', icon:'✓'},
        {id:'profil-doldur', title:'Profil Tamam', desc:'Profil bilgilerini doldurdun.', icon:'👤'},
        {id:'3-ilgi', title:'Meraklı', desc:'3 ilgi alanı seçtin.', icon:'★'},
        {id:'5-ilgi', title:'Koleksiyoncu', desc:'5+ ilgi alanı seçtin.', icon:'🏆'},
        {id:'tema-degistir', title:'Tema Ustası', desc:'Temayı değiştirdin.', icon:'🌓'},
        {id:'hafta-1', title:'1. Hafta', desc:'1. haftayı aktif geçirdin.', icon:'📆'}
      ];

      function achievementsKey(uid){ return `ag_achievements_${uid}`; }
      function loadAchievements(uid){
        try{ return JSON.parse(localStorage.getItem(achievementsKey(uid))||'[]'); }catch(_){ return []; }
      }
      function saveAchievements(uid, arr){
        try{ localStorage.setItem(achievementsKey(uid), JSON.stringify(arr)); }catch(_){ }
      }
      function hasAchievement(uid, id){ return loadAchievements(uid).includes(id); }

      function renderBadges(uid){
        const grid = document.getElementById('badgesGrid'); if(!grid) return;
        const earned = new Set(loadAchievements(uid));
        grid.innerHTML = '';
        BADGE_DEFS.forEach(def=>{
          const el = document.createElement('div');
          el.className = 'badge' + (earned.has(def.id) ? ' earned' : ' locked');
          el.setAttribute('tabindex','0');
          el.innerHTML = `<div class="icon-wrap" aria-hidden="true">${def.icon}</div><div class="b-title">${def.title}</div><div class="b-desc">${def.desc}</div>`;
          grid.appendChild(el);
        });
      }

      // Expose award function for future triggers
      window.awardBadge = function(id){
        if(typeof firebase === 'undefined' || !firebase.auth || !firebase.auth().currentUser) return;
        const uid = firebase.auth().currentUser.uid;
        const current = loadAchievements(uid);
        if(!current.includes(id)){
          current.push(id);
          saveAchievements(uid, current);
          renderBadges(uid);
        }
      };
    </script>
  </body>
</html>
