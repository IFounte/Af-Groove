<!doctype html>
<html lang="tr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bağlama - AF-GROOVE</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Firebase (compat) SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <!-- Copy firebase-config.example.js -> firebase-config.js and fill your config -->
  <script src="firebase-config.js"></script>
  <script src="course-data.js"></script>
</head>

<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <a href="anasayfa.html"><img class="brand-logo" src="assets/afgroove-full.svg" alt="AF-GROOVE" /></a>
      </div>
      <div class="top-controls">
        <div id="userArea" class="user-area" aria-live="polite">
          <!-- Auth script fills this area when user signed in -->
        </div>

        <div class="header-auth" id="headerAuth">
          <button id="headerSignupBtn" class="btn primary">Kayıt Ol</button>
          <button id="headerSigninBtn" class="btn secondary">Giriş Yap</button>
        </div>

        <button class="theme-toggle" id="themeToggle" aria-label="Tema değiştir">
          <span class="toggle-track" aria-hidden="true"></span>
          <span class="toggle-knob" aria-hidden="true">
            <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true">
              <circle cx="12" cy="12" r="5" fill="currentColor" />
              <g fill="currentColor">
                <circle cx="12" cy="3" r="1.1" />
                <circle cx="12" cy="21" r="1.1" />
                <circle cx="21" cy="12" r="1.1" />
                <circle cx="3" cy="12" r="1.1" />
                <circle cx="18.5" cy="5.5" r="1.1" />
                <circle cx="5.5" cy="5.5" r="1.1" />
                <circle cx="18.5" cy="18.5" r="1.1" />
                <circle cx="5.5" cy="18.5" r="1.1" />
              </g>
            </svg>
            <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" fill="currentColor" />
            </svg>
          </span>
        </button>
      </div>
    </div>
  </header>

  <main style="padding:28px 18px;">
    <div class="app-area" style="max-width:1000px;margin:18px auto;padding:24px;">
      <h1>Bağlama Eğitimi</h1>
      <p>Bağlama öğrenmeye hoşgeldiniz! Bu sayfada temel teknikler, makamlar ve başlangıç düzeyinden ileri düzeye kadar
        pratikler bulacaksınız.</p>

      <div style="display:flex;gap:18px;align-items:flex-start;margin-top:18px;flex-wrap:wrap;">
        <img src="assets/Bağlama_yatay.png" alt="Bağlama"
          style="width:420px;max-width:100%;height:auto;border-radius:10px;box-shadow:var(--shadow);" loading="lazy"
          decoding="async" />
        <div style="flex:1;min-width:260px;">
          <h3>Öne çıkan dersler</h3>
          <ul>
            <li>Temel akorlar ve tutuş</li>
            <li>Ritim çalışmaları</li>
            <li>Makam temelleri</li>
            <li>Repertuar ve parçalar</li>
          </ul>

          <div id="heroAction" style="margin-top:24px;">
            <!-- Button injected by JS -->
          </div>

          <p style="margin-top:18px;"><a href="anasayfa.html" class="btn secondary">Geri Dön</a></p>
        </div>
      </div>

      <!-- Dynamic Accordion -->
      <div id="courseAccordion" class="baglama-accordion" aria-live="polite" style="margin-top:32px;"></div>

    </div>
  </main>

  <footer>
    <small>© <span id="year">2025</span> AF-GROOVE</small>
  </footer>

  <script src="script.js" defer></script>
  <script>
    // keep homepage redirect disabled
    window.AG_DISABLE_HOME_REDIRECT = true;

    document.addEventListener('DOMContentLoaded', function () {
      renderCourseContent();
      updateHeroAction();
    });

    function renderCourseContent() {
      const course = window.getCourse ? window.getCourse('baglama') : null;
      if (!course) return;

      const container = document.getElementById('courseAccordion');
      container.innerHTML = '';

      // For Learning Path design, we might want to flatten sections or show them as groups on the path.
      // Let's iterate sections but render them as a continuous path.
      // We also need user progress to determine states.

      const userId = localStorage.getItem('ag_last_uid') || 'guest';
      const progressKey = `ag_progress_${userId}`;
      let progress = {};
      try { progress = JSON.parse(localStorage.getItem(progressKey)) || {}; } catch (_) { }

      let foundNext = false; // flag to find the first non-completed (current) item

      course.sections.forEach((section, sIdx) => {
        // Section Title Marker
        const secTitle = document.createElement('div');
        secTitle.style.textAlign = 'center';
        secTitle.style.margin = '32px 0 16px 0';
        secTitle.style.fontWeight = '700';
        secTitle.style.color = 'var(--accent)';
        secTitle.style.textTransform = 'uppercase';
        secTitle.style.letterSpacing = '1px';
        secTitle.textContent = section.title;
        container.appendChild(secTitle);

        const pathContainer = document.createElement('div');
        pathContainer.className = 'learning-path';

        section.modules.forEach((mod, mIdx) => {
          const isCompleted = !!progress[mod.id];
          let state = 'locked';

          if (isCompleted) {
            state = 'completed';
          } else if (!foundNext) {
            state = 'current';
            foundNext = true;
          } else {
            state = 'locked';
          }

          const step = document.createElement('div');
          step.className = `path-step ${state}`;

          // Determine icon
          let iconHtml = '';
          if (mod.type === 'quiz') {
            iconHtml = '<span class="node-icon-text">?</span>';
          } else {
            // Use svg/img or default
            iconHtml = `<img src="${mod.poster || 'assets/afgroove-full.svg'}" alt="">`;
          }

          // If completed, maybe checkmark overlay? handled by css filter for now.

          step.innerHTML = `
              <div class="path-node" title="${state}">
                  ${iconHtml}
              </div>
              <div class="path-label">
                  <h4>${mod.title}</h4>
                  <p>${mod.description || (mod.type === 'video' ? mod.duration : 'Test')}</p>
              </div>
           `;
          pathContainer.appendChild(step);
        });

        container.appendChild(pathContainer);
      });
    }

    // Existing updateHeroAction remains same...
    function updateHeroAction() {
      const userId = localStorage.getItem('ag_last_uid') || 'guest';
      const progressKey = `ag_progress_${userId}`;
      let progress = {};
      try { progress = JSON.parse(localStorage.getItem(progressKey)) || {}; } catch (_) { }

      const course = window.getCourse('baglama');
      let targetModuleId = null;
      let isContinue = false;

      // Find first incomplete module
      for (const sec of course.sections) {
        for (const mod of sec.modules) {
          if (!progress[mod.id]) {
            targetModuleId = mod.id;
            break;
          } else {
            isContinue = true;
          }
        }
        if (targetModuleId) break;
      }

      // If all done
      if (!targetModuleId) {
        targetModuleId = course.sections[0].modules[0].id; // Fallback or certificate page
      }

      const btnArea = document.getElementById('heroAction');
      const label = isContinue ? "Kursa Devam Et" : "Kursa Başla";

      // Update: use a bigger, pulsing button styling if available or just standar
      btnArea.innerHTML = `
            <a href="player.html?course=baglama&module=${targetModuleId}" class="btn primary" style="text-decoration:none;display:inline-block;padding:16px 32px;font-size:18px;">
               ${label}
            </a>
         `;
    }

    // Removed old toggleSection logic as it is not used in the path view
    // (Or kept if we want to revert, but better clean up)
    window.toggleSection = null;


  </script>
  <script src="firebase-auth.js" defer></script>
</body>

</html>
